<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ffffff" />
    <title>Connection unavailable</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: #fff;
        color: #18181b;
        font-family: system-ui, sans-serif;
        text-align: center;
      }
      main {
        max-width: 320px;
      }
      h1 {
        margin: 0;
        font-size: 28px;
        font-weight: 900;
      }
      p {
        color: #71717a;
        line-height: 1.5;
      }
      button {
        min-height: 48px;
        border: 0;
        border-radius: 999px;
        padding: 0 24px;
        background: #18181b;
        color: #fff;
        font: inherit;
        font-weight: 800;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>You're offline</h1>
      <p>
        Check your connection and make sure the Social Commerce server is
        available.
      </p>
      <button type="button" onclick="window.location.reload()">
        Try again
      </button>
    </main>
  </body>
</html>
